name: Mobile CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'apps/mobile/**'
      - '!apps/mobile/**/*.md'
  workflow_dispatch:
    inputs:
      auto_submit:
        description: 'Auto submit to Google Play'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy:
    name: EAS Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Typecheck Mobile
        run: pnpm --filter mobile typecheck

      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Build & Auto-Submit to Google Play
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile production --auto-submit --non-interactive
